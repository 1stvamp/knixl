# Build knixl.dev from site/ (which renders docs/, examples/ and CHANGELOG.md), and on main
# publish it to the gh-pages branch. Pull requests only build, so a broken link or type error
# fails the PR instead of the deploy.
name: Site

on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "examples/**"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "crates/knixl-modules/stdlib/openssh/**"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "examples/**"
      - "CHANGELOG.md"
      - "Cargo.toml"
      - "crates/knixl-modules/stdlib/openssh/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
          include-hidden-files: true

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      # A single fresh commit each time: gh-pages holds build output only, so its history
      # has nothing worth keeping.
      - name: Publish to gh-pages
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f CNAME && test -f .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
