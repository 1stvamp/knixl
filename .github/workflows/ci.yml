name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.87.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Provide nixfmt
        run: |
          nix profile install nixpkgs#nixfmt-rfc-style
          echo "KNIXL_FORMATTER=$(command -v nixfmt)" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo build --workspace --tests
      - run: cargo test --workspace
      # knixl-modules embeds its stdlib via include_dir!; assert the files that would be packaged
      # actually include it. An embedded path escaping the crate directory (as it did pre-1.0) is
      # not under the crate dir, so it never appears in the packaged file list. `--list` neither
      # builds nor resolves dependencies, so it stays green during a version-bump release (when
      # the workspace's own crates are not yet published at the new version).
      - run: cargo package -p knixl-modules --list --allow-dirty | grep -q '^stdlib/web-service/knixl-module.kdl$'
